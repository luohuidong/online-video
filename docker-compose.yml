services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-online_video}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_dev_pw}
    ports:
      # 暴露到宿主机，供 config.yml 的 127.0.0.1:3306 本地开发使用
      - "3306:3306"
    volumes:
      # MySQL 数据持久化
      - online-video-mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - "-p${MYSQL_ROOT_PASSWORD:-root_dev_pw}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      # config.yml 里的 url 指向 127.0.0.1，是给本地开发用的；
      # 容器内要走 compose 网络的服务名，所以用环境变量覆盖。
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app_dev_pw}@mysql:3306/${MYSQL_DATABASE:-online_video}
    volumes:
      # Mount config file (edit config.yml to configure sources)
      - ./config.yml:/app/config.yml:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "9000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  online-video-mysql:
