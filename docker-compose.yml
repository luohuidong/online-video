services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    volumes:
      # SQLite data persistence
      - online-video-data:/app/.data
      # Mount config file (edit config.yml to configure sources)
      - ./config.yml:/app/config.yml:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "9000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  online-video-data:
