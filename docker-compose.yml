services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-online_video}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_dev_pw}
    ports:
      # 暴露到宿主机，供 config.yml 的 127.0.0.1:3306 本地开发使用
      - "3306:3306"
    volumes:
      # MySQL 数据持久化
      - online-video-mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - "-p${MYSQL_ROOT_PASSWORD:-root_dev_pw}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    volumes:
      # 视频源配置。长语法 + create_host_path: false 的理由同 .env：
      # 短语法在源路径缺失时会静默创建同名目录，容器里读配置就会得到
      # EISDIR（曾经就踩过：仓库根的 config.yml 是个 root 拥有的空目录，
      # /videos 搜索直接 500，而应用启动一切正常）。
      - type: bind
        source: ./config.yml
        target: /app/config.yml
        read_only: true
        bind:
          create_host_path: false
      # 数据库凭据，同样 bind mount。
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "9000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  online-video-mysql:
